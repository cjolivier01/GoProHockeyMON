<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .board { fill: #ffffff; stroke: #111827; stroke-width: 3; rx: 18; }
      .title { font: 700 27px sans-serif; fill: #111827; }
      .subtitle { font: 600 18px sans-serif; fill: #374151; }
      .label { font: 15px sans-serif; fill: #111827; }
      .small { font: 13px sans-serif; fill: #4b5563; }
      .pin { fill: #e5e7eb; stroke: #374151; stroke-width: 2; }
      .spi { stroke: #2563eb; stroke-width: 6; fill: none; marker-end: url(#arrow-blue); }
      .spi2 { stroke: #7c3aed; stroke-width: 6; fill: none; marker-end: url(#arrow-purple); }
      .gnd { stroke: #111827; stroke-width: 7; fill: none; }
      .pwr { stroke: #16a34a; stroke-width: 5; fill: none; stroke-dasharray: 12 8; }
      .note { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; rx: 12; }
      .warn { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; rx: 12; }
      .screen { fill: #111827; stroke: #2563eb; stroke-width: 3; rx: 12; }
      .screen2 { fill: #dbeafe; stroke: #60a5fa; stroke-width: 2; rx: 6; }
      .wifi { fill: #ecfeff; stroke: #0891b2; stroke-width: 2; rx: 10; }
    </style>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1280" height="820"/>
  <text class="title" x="54" y="54">GoPro Remote: DFRobot ESP32-P4 Worker + Waveshare ESP32-S3-Touch-LCD-2.8</text>
  <text class="small" x="54" y="82">S3 owns UI/display/touch. P4 is optional worker hardware. P4 pin names match DFRobot FireBeetle 2 ESP32-P4 AI Vision.</text>

  <rect class="board" x="60" y="130" width="455" height="475"/>
  <text class="title" x="96" y="178">DFRobot ESP32-P4</text>
  <text class="subtitle" x="96" y="206">Optional supported preview worker</text>
  <rect class="wifi" x="98" y="236" width="300" height="86"/>
  <text class="label" x="120" y="268">WiFi to GoPro AP</text>
  <text class="small" x="120" y="292">HTTP controls + UDP 8554 MPEG-TS</text>
  <text class="small" x="120" y="312">JPEG/baseline H.264, scale, RGB565</text>

  <rect class="pin" x="455" y="350" width="42" height="27"/>
  <text class="label" x="220" y="369">P4 SCL / GPIO8  SCLK</text>
  <rect class="pin" x="455" y="390" width="42" height="27"/>
  <text class="label" x="220" y="409">P4 TX / GPIO37  MOSI</text>
  <rect class="pin" x="455" y="430" width="42" height="27"/>
  <text class="label" x="220" y="449">P4 RX / GPIO38  MISO</text>
  <rect class="pin" x="455" y="470" width="42" height="27"/>
  <text class="label" x="220" y="489">P4 SDA / GPIO7  CS</text>
  <rect class="pin" x="455" y="510" width="42" height="27"/>
  <text class="label" x="240" y="529">3V3 logic reference</text>
  <rect class="pin" x="455" y="550" width="42" height="27"/>
  <text class="label" x="240" y="569">GND</text>

  <rect class="board" x="765" y="130" width="455" height="475"/>
  <text class="title" x="800" y="178">Waveshare ESP32-S3-Touch-LCD-2.8</text>
  <text class="subtitle" x="800" y="206">Display, touch, BLE wake/pair</text>
  <rect class="screen" x="805" y="236" width="165" height="235"/>
  <rect class="screen2" x="822" y="262" width="131" height="174"/>
  <text class="small" x="835" y="334" fill="#111827">240 x 320</text>
  <text class="small" x="835" y="358" fill="#111827">ST7789 SPI</text>
  <text class="small" x="835" y="382" fill="#111827">CST328 touch</text>
  <text class="label" x="995" y="268">Dedicated onboard pins</text>
  <text class="small" x="995" y="294">LCD: GPIO39-42,45,5</text>
  <text class="small" x="995" y="318">Touch: GPIO1-4</text>
  <text class="small" x="995" y="342">Power: GPIO6/7, BAT ADC GPIO8</text>
  <text class="small" x="995" y="366">SD: GPIO14/16/17/21</text>

  <rect class="pin" x="785" y="350" width="42" height="27"/>
  <text class="label" x="842" y="369">S3 GPIO18 SCLK</text>
  <rect class="pin" x="785" y="390" width="42" height="27"/>
  <text class="label" x="842" y="409">S3 GPIO15 MOSI</text>
  <rect class="pin" x="785" y="430" width="42" height="27"/>
  <text class="label" x="842" y="449">S3 GPIO43 MISO / TXD header</text>
  <rect class="pin" x="785" y="470" width="42" height="27"/>
  <text class="label" x="842" y="489">S3 GPIO44 CS / RXD header</text>
  <rect class="pin" x="785" y="510" width="42" height="27"/>
  <text class="label" x="842" y="529">S3 3V3 header reference</text>
  <rect class="pin" x="785" y="550" width="42" height="27"/>
  <text class="label" x="842" y="569">GND</text>

  <path class="spi" d="M497 363 C590 330, 690 330, 785 363"/>
  <text class="label" x="548" y="318" fill="#2563eb">DFRobot P4 SCL/GPIO8 -> S3 GPIO18</text>
  <path class="spi" d="M497 403 C590 375, 690 375, 785 403"/>
  <text class="label" x="548" y="364" fill="#2563eb">DFRobot P4 TX/GPIO37 -> S3 GPIO15</text>
  <path class="spi2" d="M785 443 C690 475, 590 475, 497 443"/>
  <text class="label" x="548" y="493" fill="#7c3aed">S3 GPIO43 -> DFRobot P4 RX/GPIO38</text>
  <path class="spi" d="M497 483 C590 515, 690 515, 785 483"/>
  <text class="label" x="548" y="535" fill="#2563eb">DFRobot P4 SDA/GPIO7 -> S3 GPIO44</text>
  <path class="pwr" d="M497 523 C590 555, 690 555, 785 523"/>
  <text class="label" x="548" y="582" fill="#16a34a">3.3 V logic reference only</text>
  <path class="gnd" d="M497 563 L785 563"/>

  <path class="pwr" d="M280 640 C450 710, 830 710, 1000 640"/>
  <text class="small" x="374" y="735">Power both boards from the same battery/regulator plan if integrated. Share ground. Do not back-power through signal pins or USB.</text>

  <rect class="note" x="65" y="632" width="350" height="108"/>
  <text class="subtitle" x="92" y="664">P4 firmware</text>
  <text class="small" x="92" y="690">GoPro AP join, HTTP settings, UDP stream</text>
  <text class="small" x="92" y="712">JPEG/baseline H.264, scale to 240-wide RGB565</text>

  <rect class="note" x="865" y="632" width="350" height="108"/>
  <text class="subtitle" x="892" y="664">S3 firmware</text>
  <text class="small" x="892" y="690">ST7789/touch/power key/BLE wake-pair</text>
  <text class="small" x="892" y="712">SPI frame receiver and on-screen controls</text>

  <rect class="warn" x="455" y="642" width="365" height="90"/>
  <text class="subtitle" x="482" y="674">Reserved pins</text>
  <text class="small" x="482" y="700">P4: avoid C6 SDIO GPIO14-19 and TF GPIO39-45.</text>
  <text class="small" x="482" y="720">S3: do not steal LCD/touch/SD/power pins.</text>
</svg>
