<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .board { fill: #ffffff; stroke: #1f2937; stroke-width: 3; rx: 18; }
      .title { font: 700 30px sans-serif; fill: #111827; }
      .subtitle { font: 600 18px sans-serif; fill: #374151; }
      .label { font: 16px sans-serif; fill: #111827; }
      .small { font: 14px sans-serif; fill: #4b5563; }
      .pin { fill: #e5e7eb; stroke: #374151; stroke-width: 2; }
      .tx { stroke: #2563eb; stroke-width: 7; fill: none; marker-end: url(#arrow-blue); }
      .rx { stroke: #dc2626; stroke-width: 7; fill: none; marker-end: url(#arrow-red); }
      .gnd { stroke: #111827; stroke-width: 7; fill: none; }
      .power { stroke: #16a34a; stroke-width: 5; stroke-dasharray: 12 9; fill: none; }
      .note { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; rx: 12; }
      .warn { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; rx: 12; }
      .screen { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2; rx: 10; }
    </style>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="760"/>
  <text class="title" x="60" y="58">GoPro Remote: ESP32-P4 UI Host + ESP32-S3 Radio Coprocessor</text>
  <text class="small" x="60" y="86">Default firmware link: UART, 921600 baud, 3.3 V logic. Cross TX/RX and share ground.</text>

  <rect class="board" x="70" y="140" width="420" height="430"/>
  <text class="title" x="105" y="190">ESP32-P4</text>
  <text class="subtitle" x="105" y="218">UI / display host</text>
  <rect class="screen" x="110" y="250" width="300" height="155"/>
  <text class="label" x="135" y="310">LCD + touch connect here</text>
  <text class="small" x="135" y="340">RGB / MIPI / SPI depends on board</text>
  <text class="small" x="135" y="365">P4 owns UI, touch, preview display</text>

  <rect class="pin" x="420" y="438" width="42" height="30"/>
  <text class="label" x="245" y="459">GPIO16  RX</text>
  <rect class="pin" x="420" y="488" width="42" height="30"/>
  <text class="label" x="245" y="509">GPIO17  TX</text>
  <rect class="pin" x="420" y="538" width="42" height="30"/>
  <text class="label" x="285" y="559">GND</text>

  <rect class="board" x="710" y="140" width="420" height="430"/>
  <text class="title" x="745" y="190">ESP32-S3</text>
  <text class="subtitle" x="745" y="218">BLE / Wi-Fi radio</text>
  <text class="label" x="760" y="278">Runs env: esp32s3_radio</text>
  <text class="small" x="760" y="308">BLE pair / wake</text>
  <text class="small" x="760" y="333">Wi-Fi to GoPro AP or home Wi-Fi</text>
  <text class="small" x="760" y="358">HTTP camera controls</text>
  <text class="small" x="760" y="383">UDP preview stream receive/proxy</text>

  <rect class="pin" x="738" y="438" width="42" height="30"/>
  <text class="label" x="795" y="459">GPIO17  TX</text>
  <rect class="pin" x="738" y="488" width="42" height="30"/>
  <text class="label" x="795" y="509">GPIO16  RX</text>
  <rect class="pin" x="738" y="538" width="42" height="30"/>
  <text class="label" x="795" y="559">GND</text>

  <path class="tx" d="M462 453 C560 420, 635 420, 738 453"/>
  <text class="label" x="535" y="410" fill="#2563eb">S3 TX GPIO17 -> P4 RX GPIO16</text>

  <path class="rx" d="M462 503 C560 535, 635 535, 738 503"/>
  <text class="label" x="535" y="565" fill="#dc2626">P4 TX GPIO17 -> S3 RX GPIO16</text>

  <path class="gnd" d="M462 553 L738 553"/>
  <text class="label" x="548" y="590">Common GND required</text>

  <path class="power" d="M282 610 C435 675, 760 675, 920 610"/>
  <text class="small" x="395" y="703">Power both boards from a suitable regulated supply. Do not back-power USB ports accidentally.</text>

  <rect class="note" x="70" y="610" width="300" height="90"/>
  <text class="subtitle" x="95" y="642">Firmware defaults</text>
  <text class="small" x="95" y="668">GOPRO_UI_LINK_RX_PIN=16</text>
  <text class="small" x="95" y="690">GOPRO_UI_LINK_TX_PIN=17</text>

  <rect class="note" x="830" y="610" width="300" height="90"/>
  <text class="subtitle" x="855" y="642">Radio defaults</text>
  <text class="small" x="855" y="668">GOPRO_LINK_RX_PIN=16</text>
  <text class="small" x="855" y="690">GOPRO_LINK_TX_PIN=17</text>

  <rect class="warn" x="420" y="625" width="360" height="75"/>
  <text class="subtitle" x="445" y="656">Next hardware revision</text>
  <text class="small" x="445" y="682">Use SPI or SDIO instead of UART for higher-rate preview data.</text>
</svg>
