<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="860" viewBox="0 0 1300 860">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .board { fill: #ffffff; stroke: #111827; stroke-width: 3; rx: 18; }
      .display { fill: #020617; stroke: #334155; stroke-width: 4; }
      .active { fill: #0f172a; stroke: #38bdf8; stroke-width: 3; }
      .touch { fill: #e0f2fe; stroke: #0284c7; stroke-width: 2; rx: 10; }
      .note { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; rx: 12; }
      .warn { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; rx: 12; }
      .title { font: 700 30px sans-serif; fill: #111827; }
      .subtitle { font: 600 19px sans-serif; fill: #1f2937; }
      .label { font: 16px sans-serif; fill: #111827; }
      .small { font: 14px sans-serif; fill: #4b5563; }
      .pin { fill: #e5e7eb; stroke: #374151; stroke-width: 2; }
      .qspi { stroke: #2563eb; stroke-width: 5; fill: none; }
      .i2c { stroke: #7c3aed; stroke-width: 5; fill: none; }
      .ctrl { stroke: #059669; stroke-width: 5; fill: none; }
      .pwr { stroke: #111827; stroke-width: 5; fill: none; }
      .mipi { stroke: #dc2626; stroke-width: 5; stroke-dasharray: 12 8; fill: none; }
    </style>
  </defs>

  <rect class="bg" width="1300" height="860"/>
  <text class="title" x="60" y="58">ESP32-P4 Watch-Style Display Hookup</text>
  <text class="small" x="60" y="86">Prototype route: 1.43&quot; 466x466 round AMOLED with QSPI display + I2C capacitive touch. All signal lines are 3.3 V.</text>

  <rect class="board" x="70" y="145" width="440" height="610"/>
  <text class="title" x="105" y="195">ESP32-P4 UI Board</text>
  <text class="subtitle" x="105" y="224">Runs env: esp32p4_ui</text>
  <text class="small" x="105" y="254">P4 renders UI, receives GoPro state/preview chunks from S3 radio.</text>

  <rect class="pin" x="430" y="300" width="48" height="26"/><text class="label" x="130" y="320">GPIO10  QSPI SCLK</text>
  <rect class="pin" x="430" y="335" width="48" height="26"/><text class="label" x="130" y="355">GPIO11  QSPI D0 / MOSI</text>
  <rect class="pin" x="430" y="370" width="48" height="26"/><text class="label" x="130" y="390">GPIO12  QSPI D1 / MISO</text>
  <rect class="pin" x="430" y="405" width="48" height="26"/><text class="label" x="130" y="425">GPIO13  QSPI D2</text>
  <rect class="pin" x="430" y="440" width="48" height="26"/><text class="label" x="130" y="460">GPIO14  QSPI D3</text>
  <rect class="pin" x="430" y="475" width="48" height="26"/><text class="label" x="130" y="495">GPIO15  Display CS</text>

  <rect class="pin" x="430" y="535" width="48" height="26"/><text class="label" x="130" y="555">GPIO7   Touch SDA</text>
  <rect class="pin" x="430" y="570" width="48" height="26"/><text class="label" x="130" y="590">GPIO8   Touch SCL</text>
  <rect class="pin" x="430" y="605" width="48" height="26"/><text class="label" x="130" y="625">GPIO9   Touch INT</text>
  <rect class="pin" x="430" y="640" width="48" height="26"/><text class="label" x="130" y="660">GPIO27  Display / Touch RST</text>

  <rect class="pin" x="430" y="695" width="48" height="26"/><text class="label" x="130" y="715">3V3 or panel VDD</text>
  <rect class="pin" x="430" y="730" width="48" height="26"/><text class="label" x="130" y="750">GND</text>

  <circle class="display" cx="980" cy="410" r="190"/>
  <circle class="active" cx="980" cy="410" r="158"/>
  <text class="subtitle" x="875" y="385" fill="#e0f2fe">1.43&quot; round AMOLED</text>
  <text class="small" x="890" y="415" fill="#bae6fd">466 x 466</text>
  <text class="small" x="872" y="442" fill="#bae6fd">CO5300-class QSPI</text>

  <rect class="touch" x="805" y="645" width="350" height="105"/>
  <text class="subtitle" x="830" y="680">Capacitive Touch</text>
  <text class="small" x="830" y="708">CST820 / similar over I2C</text>
  <text class="small" x="830" y="732">Touch is not carried over display QSPI/MIPI.</text>

  <path class="qspi" d="M478 313 C610 270, 745 260, 835 305"/>
  <path class="qspi" d="M478 348 C620 315, 745 300, 835 330"/>
  <path class="qspi" d="M478 383 C620 360, 750 345, 835 355"/>
  <path class="qspi" d="M478 418 C620 407, 750 392, 835 382"/>
  <path class="qspi" d="M478 453 C620 455, 750 435, 835 410"/>
  <path class="qspi" d="M478 488 C620 500, 750 480, 835 438"/>
  <text class="label" x="585" y="292" fill="#2563eb">QSPI display bus</text>

  <path class="i2c" d="M478 548 C600 615, 700 670, 805 690"/>
  <path class="i2c" d="M478 583 C600 650, 700 700, 805 715"/>
  <path class="i2c" d="M478 618 C600 690, 700 735, 805 735"/>
  <text class="label" x="585" y="655" fill="#7c3aed">I2C touch + interrupt</text>

  <path class="ctrl" d="M478 653 C610 590, 740 540, 845 505"/>
  <text class="label" x="590" y="580" fill="#059669">Reset / enable</text>

  <path class="pwr" d="M478 708 C610 770, 775 790, 915 600"/>
  <path class="pwr" d="M478 743 C620 815, 820 805, 940 602"/>
  <text class="label" x="610" y="807">Power and ground</text>

  <rect class="note" x="60" y="785" width="535" height="55"/>
  <text class="small" x="85" y="818">Pins are a proposed starting map. Change them in firmware once the exact P4 board and panel FPC/adapter are selected.</text>

  <rect class="warn" x="645" y="785" width="585" height="55"/>
  <text class="small" x="670" y="818">Known-supported EV-board route: Espressif 7&quot; LCD adapter uses the P4 MIPI-DSI FFC plus GPIO27 reset and GPIO26 PWM.</text>

  <path class="mipi" d="M240 265 C430 140, 720 115, 910 245"/>
  <text class="label" x="555" y="135" fill="#dc2626">Alternative: MIPI-DSI FFC for supported panels/adapters</text>
</svg>
