[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
build_src_filter =
  +<common/>
  +<radio/>
upload_port = /dev/ttyUSB0
upload_speed = 115200
monitor_speed = 115200
build_flags =
  -I src/common
  -D GOPRO_CAMERA_IP=\"10.5.5.9\"
  -D GOPRO_CAMERA_NAME_FILTER=\"GoPro,MISSION,GP\"
  -D GOPRO_AUTO_START=1

[env:esp32s3_radio]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.partitions = huge_app.csv
build_src_filter =
  +<common/>
  +<radio/>
monitor_speed = 115200
build_flags =
  -I src/common
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D GOPRO_CAMERA_NAME_FILTER=\"GoPro,MISSION,GP\"
  -D GOPRO_AUTO_START=0
  -D GOPRO_LINK_RX_PIN=16
  -D GOPRO_LINK_TX_PIN=17

[env:esp32s3_amoled_ui]
platform = https://github.com/pioarduino/platform-espressif32.git
board = esp32s3_120_16_8-qio_opi
framework = arduino
board_build.partitions = huge_app.csv
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
build_src_filter =
  +<amoled/>
monitor_speed = 115200
upload_speed = 921600
upload_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_1C:DB:D4:7A:16:B4-if00
monitor_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_1C:DB:D4:7A:16:B4-if00
lib_extra_dirs =
  ${sysenv.HOME}/src/ESP32-S3-Touch-AMOLED-1.8/examples/Arduino-v3.3.5/libraries
lib_deps =
  bblanchon/ArduinoJson @ ^7.4.2
  bitbank2/JPEGDEC @ ^1.8.4
build_flags =
  -I ${sysenv.HOME}/src/ESP32-S3-Touch-AMOLED-1.8/examples/Arduino-v3.3.5/libraries
  -I ${sysenv.HOME}/src/ESP32-S3-Touch-AMOLED-1.8/examples/Arduino-v3.3.5/libraries/Mylibrary
  -I ${sysenv.HOME}/src/esp-h264-component/esp_h264/sw/libs/tinyh264_inc
  -L ${sysenv.HOME}/src/esp-h264-component/esp_h264/sw/libs/esp32s3
  -ltinyh264
  -D HAVE_ESP32S3
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D LV_CONF_INCLUDE_SIMPLE
  -D BOARD_HAS_PSRAM
  -D GOPRO_CAMERA_IP=\"10.5.5.9\"
  -D GOPRO_CAMERA_NAME_FILTER=\"GoPro,MISSION,GP\"
  -D GOPRO_AUTO_CONNECT_ON_BOOT=1

[env:esp32s3_ble_cred_dump]
platform = https://github.com/pioarduino/platform-espressif32.git
board = esp32-s3-devkitc-1
framework = arduino
board_build.partitions = huge_app.csv
build_src_filter =
  +<ble_cred_dump/>
monitor_speed = 115200
upload_speed = 921600
upload_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_1C:DB:D4:7A:16:B4-if00
monitor_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_1C:DB:D4:7A:16:B4-if00
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D GOPRO_CAMERA_NAME_FILTER=\"GoPro,MISSION,GP\"

[env:ui_esp32dev_sim]
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
build_src_filter =
  +<common/>
  +<ui/>
monitor_speed = 115200
build_flags =
  -I src/common
  -D GOPRO_UI_LINK_RX_PIN=16
  -D GOPRO_UI_LINK_TX_PIN=17

[env:esp32p4_ui]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21-2/platform-espressif32.zip
board = esp32-p4-evboard
framework = arduino
build_src_filter =
  +<common/>
  +<ui/>
monitor_speed = 115200
upload_speed = 460800
upload_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_30:ED:A0:EA:14:3F-if00
monitor_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_30:ED:A0:EA:14:3F-if00
build_flags =
  -I src/common
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D BOARD_HAS_PSRAM
  -D GOPRO_P4_DECODE_OUT_W=240
  -D GOPRO_P4_DECODE_OUT_H=320
  -D GOPRO_UI_LINK_RX_PIN=38
  -D GOPRO_UI_LINK_TX_PIN=37

[env:dfrobot_p4_decode_probe]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21-2/platform-espressif32.zip
board = esp32-p4-evboard
framework = arduino
build_src_filter =
  +<p4_decode_probe/>
monitor_speed = 115200
upload_speed = 460800
upload_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_30:ED:A0:EA:14:3F-if00
monitor_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_30:ED:A0:EA:14:3F-if00
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
build_flags =
  -I src/p4_decode_probe
  -I ${sysenv.HOME}/src/esp-h264-component/esp_h264/sw/libs/tinyh264_inc
  -L ${sysenv.HOME}/src/esp-h264-component/esp_h264/sw/libs/esp32p4
  -ltinyh264
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D BOARD_HAS_PSRAM
